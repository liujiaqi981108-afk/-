[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-9agent-short-video"
version = "2.0.1"
description = "9-Agent AI Short-Film Studio with Local Chrome CDP Google Flow (Nano Banana + Veo) & PyAV Master Finishing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pillow>=10.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "av>=11.0.0",
    "numpy>=1.24.0",
    "edge-tts>=6.1.10",
    "playwright>=1.42.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
